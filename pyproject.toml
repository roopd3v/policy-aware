[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bemix-policy-aware"
version = "1.3.0"
description = "Authenticated and auditable BEMIX policy-aware decision service"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi==0.135.3", "starlette==1.3.1", "uvicorn==0.38.0", "pydantic==2.13.4"]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["bemix_pilot*", "bemix_service*"]
