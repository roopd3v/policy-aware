services:
  api:
    image: bemix-policy-aware-public:1.3.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    user: "10001:10001"
    restart: unless-stopped
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      BEMIX_DB_PATH: /var/lib/bemix/decisions.sqlite
      BEMIX_AUDIT_KEY_FILE: /run/bemix-keys/audit.key
      BEMIX_ALLOWED_HOSTS: ${BEMIX_ALLOWED_HOSTS:?Set the exact API hostname and localhost for health checks}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - data:/var/lib/bemix
      - keys:/run/bemix-keys:ro
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  operator:
    image: bemix-policy-aware-public:1.3.0
    profiles: [operator]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - data:/var/lib/bemix
      - keys:/run/bemix-keys
    entrypoint: [python, -m, bemix_service, --db, /var/lib/bemix/decisions.sqlite, --key-file, /run/bemix-keys/audit.key]
volumes:
  data:
  keys:
