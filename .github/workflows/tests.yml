name: Tests and synthetic workflow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes -r requirements-test.lock
      - run: python scripts/build_examples.py --check
      - run: docker build -f deploy/Dockerfile -t bemix-policy-aware-public:1.3.0 .
      - run: python scripts/smoke_container.py
      - run: python scripts/verify.py
